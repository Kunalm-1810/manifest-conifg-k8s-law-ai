apiVersion: v1
kind: deployment
metadata:
  name: be-deployment
  labels:
    app: be-law-ai
    env: staging
spec:
  replicas: 2
  strategy:
    type: RollingUpdate 
  selector:
    matchLabels:
      app: be-law-ai
      env: staging
  template:
    metadata:
      name: be-law-ai-pod
      labels:
        app: be-law-ai
        env: staging
    spec:
      serviceAccountName: default
      containers:
      - name: be-law-ai-container
        image: kunalmane/be-law-ai-project:v1.1
        ports:
        - containerPort: 5000
        envfrom:
          - secretRef:
              name: be-env-secret
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"