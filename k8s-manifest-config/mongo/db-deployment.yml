apiVersion: v1
kind: deployment
metadata:
  name: be-deployment
  labels:
    app: be-law-ai
    env: staging
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:  
    app: be-law-ai
    env: staging
  template:
    metadata:
      name: mongo-pod
      labels:
        app: mongo
        env: staging
    spec:
      serviceAccountName: default
      containers: 
      - name: mongo-container
        image: mongo:6.0
        ports:
        - containerPort: 27017
        resources:
          limits:
            memory: "1Gi"
            cpu: "1"
          requests:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: mongo-persistent-storage
          mountPath: /data/db
      volumes:
      - name: mongo-persistent-storage
        persistentVolumeClaim:
          claimName: mongo-pvc
